[project]
name = "stockpilot-backend"
version = "1.0.0"
description = "StockPilot inventory management API"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-third-party = ["alembic"]
