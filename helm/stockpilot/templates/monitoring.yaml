{{- $fullname := include "stockpilot.fullname" . -}}
{{- if .Values.monitoring.serviceMonitor.enabled }}
# Tells the Prometheus Operator to scrape every backend pod's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "stockpilot.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}-alerts
  labels:
    {{- include "stockpilot.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  groups:
    - name: stockpilot.availability
      rules:
        - alert: StockPilotBackendDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", service="{{ $fullname }}-backend"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No StockPilot backend pod is being scraped successfully.
        - alert: StockPilotHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status="5xx"}[5m]))
              / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of StockPilot API requests are failing with 5xx.
    - name: stockpilot.inventory
      rules:
        - alert: StockPilotProductsOutOfStock
          expr: max(stockpilot_out_of_stock_products{namespace="{{ .Release.Namespace }}"}) > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: At least one product has been out of stock for 10 minutes.
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
# Picked up by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-dashboard
  labels:
    {{- include "stockpilot.labels" (dict "root" $ "component" "monitoring") | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
    {{- .Files.Get "dashboards/stockpilot.json" | nindent 4 }}
{{- end }}
